instructions: >-
  E2E tests drive a user-visible scenario, including rendering or interaction,
  through a running application's browser, CLI, or public interface across real
  internal boundaries. Unit/component tests, isolated Storybook interactions,
  individual API/DB checks, and browser-library API tests are not E2E. Mocking third-party services
  can still permit E2E. Require evidence of E2E use; names alone do not suffice.
  Only E2E-related changes establish these purposes. Product-only and empty
  commits do not qualify.

filter_mode: or
filters:
  - question: >-
      Do these changes add, modify, remove, disable, or re-enable executable E2E
      tests, their assertions or snapshots, or fixtures, test applications,
      mocks, page objects, and helpers demonstrably supporting E2E scenarios?
      Passive examples, documentation, product code, and support with no
      evidenced E2E consumers do not qualify.
    aggregation: any
  - question: >-
      Do these changes modify configuration, scripts, or dependencies explicitly
      used to install, build, or execute E2E tests or their tools? Include E2E
      runner settings, E2E support builds, and installation/caching of browsers
      used by E2E tests. Generic CI, production dependencies, and unit/component
      test infrastructure do not qualify without demonstrated direct E2E use.
    aggregation: any

classifications:
  reason:
    mode: multi
    aggregation: any
    question: >-
      Is this purpose directly supported by a change to E2E tests or their
      explicitly linked support? Each purpose needs its own supporting change;
      incidental consequences and unrelated unit/component/integration changes
      are insufficient. Several or no purposes may apply.
    categories:
      coverage: >-
        Introduce a meaningful E2E scenario, regression test, or additional
        semantic check. New E2E tests accompanying a feature or product fix
        qualify. Equivalent rewrites, renames, and expected-value replacements
        alone do not add coverage.
      product_adaptation: >-
        Modify a pre-existing E2E test's expectations, calls, or setup for an
        identifiable intended change in product behavior or interface. Require
        both the existing-test modification and the changed contract. Examples:
        use a new API argument or grant newly required permissions in an
        existing scenario. New regressions accompanying a product fix and
        test-page count updates solely for added scenarios do not qualify.
      test_bug: >-
        Correct a pre-existing deterministic defect in an E2E test, fixture,
        or helper under the intended product contract already in force, such
        as checking the wrong object or using the wrong existing endpoint.
        Changed product contracts, product regressions, and intermittent-test
        repairs do not qualify. Test-only edits do not establish this purpose.
      flakiness: >-
        Repair intermittent E2E test outcomes evidenced by a described failure
        or a concrete race, ordering dependency, shared-state leak, randomness,
        timing issue, or unstable external service. A wait, retry, timeout,
        cleanup, or skip alone is insufficient. New E2E tests using waits, or
        regressions for a product race, do not establish flaky-test repair.
      refactoring: >-
        Independently reorganize existing E2E tests or helpers while preserving
        scenarios and semantic checks, such as extracting shared existing
        setup. Rewrites needed only for new coverage, a defect repair, or a
        changed product interface do not qualify.
      environment: >-
        Maintain or migrate an E2E runner, framework, browser, test dependency,
        build, or execution environment with demonstrated direct E2E use.
        Generic automation, product runtime updates, component-only tooling,
        and the same repair of intermittent test behavior do not qualify.

filter_threshold: 0.8
multi_threshold: 0.8
limits:
  input_bytes: 49152
  max_chunks: 20
